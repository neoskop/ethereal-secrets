services:
  app:
    build: .
    command: npm start
    environment:
      NODE_ENV: 'development'
    depends_on:
      - redis
    volumes:
      - ./src:/home/node/src:ro
    ports:
      - 9229:9229
  redis:
    image: redis@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366
