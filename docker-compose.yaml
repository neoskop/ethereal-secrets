services:
  middleware:
    build:
      context: ./middleware
    environment:
      NODE_ENV: test
    volumes:
      - ./middleware/src:/home/node/src:ro
    depends_on:
      - redis

  client:
    build:
      context: ./client
    environment:
      NODE_ENV: test
    volumes:
      - ./client/src:/home/node/src:ro
    depends_on:
      - server
      - redis

  redis:
    image: redis:8-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    environment:
      PORT: 8080
      NODE_ENV: production
    depends_on:
      - redis
