services:
  middleware:
    build:
      context: ./middleware
    environment:
      NODE_ENV: test
    volumes:
      - ./middleware/src:/home/node/src:ro
    depends_on:
      - redis

  client:
    build:
      context: ./client
    environment:
      NODE_ENV: test
    volumes:
      - ./client/src:/home/node/src:ro
    depends_on:
      - server
      - redis

  redis:
    image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    environment:
      PORT: 8080
      NODE_ENV: production
    depends_on:
      - redis
